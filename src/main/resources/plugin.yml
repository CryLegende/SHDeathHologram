name: SHDeathHologram
version: '${project.version}'
main: org.Cry_Legende.sHDeathHologram.SHDeathHologram
api-version: '1.20'
author: Cry_Legende
depend: [FancyHolograms]
softdepend: [PlaceholderAPI]

commands:
  shdeathhologram:
    description: Administration de SHDeathHologram
    usage: /<command> reload

permissions:
  shdeathhologram.admin:
    description: Toutes les sous-commandes de /shdeathhologram
    default: op
    children:
      shdeathhologram.admin.reload: true
  shdeathhologram.admin.reload:
    description: Recharger la configuration (/shdeathhologram reload)
    default: op
